<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B7676">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viagens">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nossas Viagens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna (máx 720px), capa grande no topo, abas fixas, cartões só onde separam objetos */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --ink:#102530; --muted:#5A6D77; --line:#D8E2E6;
  --accent:#0B7676; --accent-ink:#FFFFFF; --soft:#DDEFEE; --sun:#D9912B; --ok:#2C8A57; --bad:#B9412F;
  --shadow:0 1px 2px rgba(16,37,48,.06),0 6px 18px rgba(16,37,48,.06);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B161B; --surface:#12212A; --ink:#E4EDF0; --muted:#94A7B0; --line:#223740;
  --accent:#3DB5AC; --accent-ink:#04201F; --soft:#123236; --sun:#EDB45A; --ok:#55C08A; --bad:#E07A68;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B161B; --surface:#12212A; --ink:#E4EDF0; --muted:#94A7B0; --line:#223740;
  --accent:#3DB5AC; --accent-ink:#04201F; --soft:#123236; --sun:#EDB45A; --ok:#55C08A; --bad:#E07A68;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- capa ---------- */
.cover{position:relative;color:#fff;background:linear-gradient(155deg,#0E3346 0%,#0B6E70 55%,#D9912B 120%);background-size:cover;background-position:center;overflow:hidden}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,20,28,.35),rgba(5,20,28,.15) 40%,rgba(5,20,28,.7))}
.cover>*{position:relative;z-index:1}
.cover .wrap{padding-block:14px 22px;display:flex;flex-direction:column;gap:14px}
.cover-top{display:flex;justify-content:space-between}
.round{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center}
.round svg{width:22px;height:22px}
.cover h1{font-size:clamp(28px,7vw,38px);line-height:1.05;margin-top:36px}
.cover-meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;opacity:.95;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.18);font-weight:600;font-size:13px}

/* ---------- abas ---------- */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:68px;border:0;background:none;padding:10px 8px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:13px;font-weight:600;border-bottom:3px solid transparent}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

main{padding-block:18px 120px}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

/* ---------- campos ---------- */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=tel],input[type=url],input:not([type]),textarea,select,input[inputmode]{
  width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea{resize:vertical;min-height:84px}
textarea.notepad{min-height:260px;line-height:1.6;background:var(--surface);background-image:repeating-linear-gradient(transparent 0 calc(1.6em - 1px),var(--line) calc(1.6em - 1px) 1.6em);background-attachment:local;padding-top:6px;border-radius:12px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.small{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:default}
.iconbtn{border:0;background:none;color:var(--muted);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--bg);color:var(--bad)}
.iconbtn svg{width:18px;height:18px}

/* ---------- listas de checagem ---------- */
.checks{display:flex;flex-direction:column}
.check{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0}
.check input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.check input[type=text]{border-color:transparent;background:none;padding:8px 4px}
.check input[type=text]:focus{border-color:var(--accent)}
.check.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.addrow{border:1px dashed var(--line);background:none;border-radius:10px;padding:9px 12px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:8px;width:100%;margin-top:8px}
.addrow svg{width:18px;height:18px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.over>i{background:var(--bad)}

/* ---------- início ---------- */
.home-hero{padding-block:28px 8px}
.home-hero h1{font-size:clamp(30px,8vw,44px);line-height:1.02}
.home-hero p{margin:8px 0 0;color:var(--muted)}
.trip-card{display:block;width:100%;text-align:left;border:0;padding:0;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface)}
.trip-card .cover .wrap{padding:16px;min-height:170px;justify-content:flex-end}
.trip-card .cover h1{margin:0;font-size:28px}
.trip-card .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;font-size:14px}
.newtrip{border:2px dashed var(--line);background:none;border-radius:20px;padding:22px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--accent);font-weight:700;font-size:16px;width:100%}
.newtrip svg{width:24px;height:24px}

/* ---------- roteiro ---------- */
.day-card{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;text-align:left;box-shadow:var(--shadow)}
.day-thumb{width:92px;height:92px;border-radius:12px;background:linear-gradient(155deg,#0E3346,#0B6E70 60%,#D9912B 130%);background-size:cover;background-position:center;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-family:var(--display);line-height:1}
.day-thumb b{font-size:26px}
.day-thumb small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.day-card h3{font-size:17px;font-family:var(--body);font-weight:700}
.day-card .muted{font-size:13.5px}
.day-card .price{font-weight:700;color:var(--accent);font-size:14px}
.act{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg)}
.act .full{grid-column:1/-1}
.act-foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.paid{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted)}
.paid input{width:20px;height:20px;accent-color:var(--ok)}
.maplink{font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.maplink svg{width:16px;height:16px}

/* ---------- linha do tempo ---------- */
.tl{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:start}
.slot-t{text-align:right;padding-top:10px;font-variant-numeric:tabular-nums;line-height:1.2}
.slot-t b{display:block;font-size:16px}
.slot-t small{color:var(--muted);font-size:12.5px}
.slot-c{border-left:3px solid var(--accent);background:var(--bg);border-radius:0 12px 12px 0;padding:10px 12px;min-width:0}
.slot-c b{display:block}
.slot-c span{color:var(--muted);font-size:13.5px}
.slot.start .slot-c{border-left-color:var(--muted);background:none;padding-block:6px}
.leg{display:grid;grid-template-columns:62px 1fr;gap:12px}
.leg-line{justify-self:end;width:2px;margin-right:14px;background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 8px);min-height:44px}
.leg-info{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13.5px;color:var(--muted);padding-block:8px}
.leg-info svg{width:16px;height:16px;vertical-align:-3px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.ok{background:var(--soft);color:var(--ok)}
.tag.bad{background:var(--bad);color:#fff}
.times{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
@media (max-width:420px){.times{grid-template-columns:1fr 1fr}.times .field:last-child{grid-column:1/-1}}

/* ---------- modo viagem, tema, estrelas ---------- */
.now{background:var(--accent);color:var(--accent-ink);border:0}
.now .label,.now .muted{color:inherit;opacity:.85}
.now h2{font-size:20px;margin-top:2px}
.now p{margin:4px 0 0}
.now a.maplink{color:inherit;text-decoration:underline}
.now-grid{display:flex;flex-direction:column;gap:12px}
.btn.onacc{background:none;border:1.5px solid currentColor;color:inherit;margin-top:10px}
.themebtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;height:40px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px}
.themebtn svg{width:18px;height:18px}
.home-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;padding:2px;color:var(--line)}
.stars button.on{color:var(--sun)}
.stars svg{width:22px;height:22px}

/* ---------- malas ---------- */
.bag-name{font-family:var(--display);font-size:20px;font-weight:700;border-color:transparent!important;background:none!important;padding:4px 6px!important}
.bag-name:focus{border-color:var(--accent)!important}
.block{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.block-h{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.block-h input{font-weight:700;border-color:transparent;background:none;padding:6px 4px}
.block-h input:focus{border-color:var(--accent)}
.bag-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ---------- plano B e backup ---------- */
details.planb>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
details.planb>summary::-webkit-details-marker{display:none}
details.planb>summary h2{font-size:18px}
details.planb .chev{transition:transform .2s;color:var(--muted);display:grid}
details.planb .chev svg{width:20px;height:20px;transform:rotate(-90deg)}
details.planb[open] .chev{transform:rotate(180deg)}
.pb-body{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.pb{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pb .full{grid-column:1/-1}
.bk-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.bk-row:last-child{border-bottom:0}
.sheet .btn{width:100%}
.sheet .actions .btn{width:auto}
.home-tools{display:flex;gap:8px}

/* ---------- edição livre ---------- */
.fl{display:flex;align-items:center;justify-content:space-between;gap:6px}
.xs{border:0;background:none;color:var(--muted);width:26px;height:26px;border-radius:6px;display:grid;place-items:center;opacity:.65;flex:none;padding:0}
.xs:hover,.xs:focus-visible{opacity:1;color:var(--bad);background:var(--bg)}
.xs svg{width:14px;height:14px}
.kv{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-top:8px}
.sec-r{display:flex;align-items:center;gap:6px;flex:none}
.card-h h2{min-width:0}
.iconbtn.more:hover{color:var(--accent)}
.addsec{justify-content:center;margin-top:0}
.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typeopt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.typeopt small{color:var(--muted);font-size:12px}
.typeopt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.grp-name{font-family:var(--display);font-size:18px;font-weight:700;border-color:transparent!important;background:none!important;padding:4px 6px!important;min-width:0}
.grp-name:focus{border-color:var(--accent)!important}
.tabchk{display:flex;flex-wrap:wrap;gap:6px 14px}
.tabchk label{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.tabchk input{width:18px;height:18px;accent-color:var(--accent)}

/* ---------- pagantes ---------- */
.exp .full{grid-column:1/-1}
.payers{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.payers-h{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px}
.payer{display:grid;grid-template-columns:1fr 104px auto;gap:6px;align-items:center}
.payer input{padding:8px 10px}
.payer-actions{display:flex;gap:14px}
.linkbtn{border:0;background:none;padding:2px 0;color:var(--accent);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.linkbtn svg{width:15px;height:15px}
.pay-row{border-bottom:1px solid var(--line)}
.pay-row>summary{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:10px 0;cursor:pointer}
.pay-row>summary::-webkit-details-marker{display:none}
.pay-row[open]>summary{color:var(--accent)}

/* ---------- exportar ---------- */
.xgs{display:flex;flex-direction:column}
.xg{padding:10px 0;border-bottom:1px solid var(--line)}
.xg:last-child{border-bottom:0}
.xg-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.xg-h label,.xg-c label{display:flex;align-items:center;gap:8px}
.xg input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.xg.off b{color:var(--muted)}
.xdet>summary{list-style:none;margin:6px 0 0 28px}
.xdet>summary::-webkit-details-marker{display:none}
.xg-c{display:flex;flex-direction:column;gap:8px;margin:8px 0 0 28px;font-size:14.5px}
.xopt{font-weight:600;color:var(--accent)}
.doc-wrap{overflow-x:auto;background:#E9EEF0;border-radius:12px;padding:12px}
.pdf-src{position:fixed;left:-10000px;top:0;width:740px}
/* o documento é sempre papel branco, nos dois temas */
.docv{background:#FFFFFF;color:#13232C;font-family:var(--body);font-size:13.5px;line-height:1.5;padding:28px 30px;border-radius:6px;max-width:720px;margin:0 auto}
.docv h1{font-family:var(--display);font-size:26px;line-height:1.1;margin:4px 0 6px;color:#0B5F60}
.dv-eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6A7B84;font-weight:700}
.dv-top{border-bottom:2px solid #0B7676;padding-bottom:12px;margin-bottom:14px}
.dv-to,.dv-dates{margin:0;color:#3E525C}
.dv-msg{background:#E6F3F2;border-radius:8px;padding:10px 12px;margin-bottom:14px}
.dv-sec{margin:0 0 14px;break-inside:auto}
.dv-sec h2{font-family:var(--display);font-size:16px;color:#0B5F60;margin:0 0 6px;padding-bottom:3px;border-bottom:1px solid #D5E0E4}
.dv-sec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6A7B84;margin:10px 0 4px}
.dv-sec h4{font-size:14px;margin:10px 0 3px;color:#13232C}
.dv-kv{display:flex;justify-content:space-between;gap:16px;padding:3px 0;border-bottom:1px dotted #DCE4E8}
.dv-kv span{color:#52646D}
.dv-kv b{text-align:right;font-weight:600}
.dv-li{display:flex;gap:8px;padding:2px 0}
.dv-li i{font-style:normal;color:#0B7676;flex:none;width:14px}
.docv p{margin:4px 0}
.dv-empty{color:#6A7B84;text-align:center;padding:20px 0}
.dv-foot{margin-top:18px!important;font-size:11px;color:#8A9AA2;text-align:center}

/* ---------- arquivos ---------- */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.file{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.file a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;height:100%;color:var(--ink);text-decoration:none;font-size:12px;padding:6px;text-align:center;word-break:break-word}
.file img{width:100%;height:100%;object-fit:cover}
.file a svg{width:28px;height:28px;color:var(--accent)}
.file .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.file .x svg{width:14px;height:14px}
.upl{border:1.5px dashed var(--line);border-radius:12px;aspect-ratio:1;max-width:100%;background:none;color:var(--accent);font-weight:600;font-size:12.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.upl svg{width:24px;height:24px}

/* ---------- clima ---------- */
.wx{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(78px,1fr);gap:8px;overflow-x:auto;padding-bottom:4px}
.wx-d{border-radius:12px;background:var(--bg);padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.wx-d svg{width:30px;height:30px;color:var(--sun)}
.wx-d .t{font-weight:700}
.wx-d small{font-size:11.5px;color:var(--muted)}
.wx-empty{opacity:.7}
.wx-empty .dash{font-size:22px;color:var(--muted);line-height:30px}

/* ---------- orçamento ---------- */
.money-big{font-family:var(--display);font-size:34px;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpi{background:var(--bg);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:15px}
.kpi span{font-size:12px;color:var(--muted)}

.idea{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}

.idea b{display:block}
.idea select{margin-top:6px;width:auto;padding:6px 8px;font-size:13.5px}

.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px;animation:up .22s ease}

.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}

<script>
/* ===== Versão GitHub Pages: guarda tudo neste aparelho (IndexedDB) ===== */
(function(){
  if(window.claude)return;
  const DBN='nossas-viagens-local';
  const idb=new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('docs');d.createObjectStore('assets')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const put=(store,key,val)=>idb.then(d=>new Promise((res,rej)=>{const t=d.transaction(store,'readwrite');t.objectStore(store).put(val,key);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)}));
  const del=(store,key)=>idb.then(d=>new Promise((res,rej)=>{const t=d.transaction(store,'readwrite');t.objectStore(store).delete(key);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)}));
  const each=(store,fn)=>idb.then(d=>new Promise((res,rej)=>{const t=d.transaction(store,'readonly');const rq=t.objectStore(store).openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){fn(c.key,c.value);c.continue()}else res()};rq.onerror=()=>rej(rq.error)}));
  const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
  const mem={},subs={},urls={};
  const ready=each('docs',(k,v)=>{const i=k.lastIndexOf('/');(mem[k.slice(0,i)]=mem[k.slice(0,i)]||{})[k.slice(i+1)]=v});
  const assetsReady=each('assets',(k,v)=>{if(v&&v.blob)urls[k]=URL.createObjectURL(v.blob)});
  const snap=(col,docs)=>{docs=docs||Object.keys(mem[col]||{}).map(id=>({id,exists:true,data:()=>clone(mem[col][id]),metadata:{fromCache:false,hasPendingWrites:false}}));return{docs,size:docs.length,empty:!docs.length,metadata:{},docChanges:()=>[]}};
  const emit=col=>(subs[col]||[]).forEach(fn=>{try{fn(snap(col))}catch(e){console.error(e)}});
  function docRef(col,id){return{id,path:col+'/'+id,
    get:async()=>{await ready;const v=(mem[col]||{})[id];return{id,exists:v!==undefined,data:()=>clone(v),metadata:{}}},
    set:async data=>{await ready;(mem[col]=mem[col]||{})[id]=clone(data);await put('docs',col+'/'+id,clone(data));emit(col)},
    update:async data=>{await ready;const cur=(mem[col]||{})[id]||{};const nv=Object.assign(clone(cur),clone(data));(mem[col]=mem[col]||{})[id]=nv;await put('docs',col+'/'+id,nv);emit(col)},
    delete:async()=>{await ready;if(mem[col])delete mem[col][id];await del('docs',col+'/'+id);emit(col)}}}
  function query(col,o){return{
    orderBy:(f,dir)=>query(col,Object.assign({},o,{f,dir})),limit:n=>query(col,Object.assign({},o,{n})),where:()=>query(col,o),
    get:async()=>{await ready;let d=snap(col).docs;if(o.f)d.sort((a,b)=>{const x=a.data()[o.f],y=b.data()[o.f];return(x>y?1:x<y?-1:0)*(o.dir==='desc'?-1:1)});if(o.n)d=d.slice(0,o.n);return snap(col,d)},
    onSnapshot:(next)=>{(subs[col]=subs[col]||[]).push(next);ready.then(()=>next(snap(col)));return()=>{subs[col]=(subs[col]||[]).filter(f=>f!==next)}}}}
  const db={collection:col=>Object.assign(query(col,{}),{path:col,doc:id=>docRef(col,id||('d'+Date.now().toString(36))),add:async data=>{const r=docRef(col,'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));await r.set(data);return r}}),doc:p=>{const i=p.lastIndexOf('/');return docRef(p.slice(0,i),p.slice(i+1))}};
  const assets={
    upload:async blob=>{const id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);await put('assets',id,{blob,type:blob.type});urls[id]=URL.createObjectURL(blob);return{id,url:'asset:'+id,sizeBytes:blob.size,contentType:blob.type}},
    delete:async id=>{await del('assets',id);if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id]}return{deleted:true}},
    list:async()=>({assets:Object.keys(urls).map(id=>({id,url:'asset:'+id})),usage:{}})};
  const downloads={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return{status:'saved'}}};
  window.__assetUrl=u=>u&&String(u).startsWith('asset:')?(urls[String(u).slice(6)]||''):u;
  window.__localAssets={
    exportFor:async trips=>{await assetsReady;const ids=[...new Set((JSON.stringify(trips).match(/asset:[a-z0-9]+/g)||[]).map(s=>s.slice(6)))],out={};
      for(const id of ids){const u=urls[id];if(!u)continue;const b=await (await fetch(u)).blob();out[id]=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}return out},
    importAll:async files=>{for(const id of Object.keys(files||{})){try{const b=await (await fetch(files[id])).blob();await put('assets',id,{blob:b,type:b.type});urls[id]=URL.createObjectURL(b)}catch(e){}}}};
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  window.claude={local:true,use:async name=>{try{if(name==='db'){await ready;return db}if(name==='assets'){await assetsReady;return assets}if(name==='downloads')return downloads}catch(e){console.error(e)}return null}};
})();
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{}));
</script>

  t.hotel=Object.assign({name:'',address:'',checkin:'',checkout:'',code:'',phone:'',notes:''},t.hotel);
  t.transport=Object.assign({kind:'',go:'',back:'',code:'',notes:''},t.transport);
  if(!Array.isArray(t.todos))t.todos=TODOS.map(x=>({t:x,done:false}));
  if(!Array.isArray(t.mala))t.mala=MALA.flatMap(([c,items])=>items.map(x=>({cat:c,t:x,done:false})));
  if(!Array.isArray(t.docs))t.docs=DOCS.map(x=>({t:x,done:false}));
  if(!Array.isArray(t.bags)){
    const used=Array.isArray(t.mala)&&t.mala.some(x=>x.done);
    t.bags=used?[{name:'Mala',blocks:[...new Set(t.mala.map(x=>x.cat))].map(c=>({name:c,items:t.mala.filter(x=>x.cat===c).map(x=>({t:x.t,done:x.done}))}))}]:[];
  }
  t.bags.forEach(b=>{if(!Array.isArray(b.blocks))b.blocks=[];b.blocks.forEach(k=>{if(!Array.isArray(k.items))k.items=[]})});
  if(!Array.isArray(t.saida))t.saida=SAIDA.flatMap(([c,items])=>items.map(x=>({cat:c,t:x,done:false})));
  ['reminders','contacts','ideas','expenses','files'].forEach(k=>{if(!Array.isArray(t[k]))t[k]=[]});
  if(!t.transpInit){TRANSP.forEach(n=>t.expenses.push({name:n,cat:'Transporte',cost:0,paid:false}));t.transpInit=true}
  const old=Array.isArray(t.days)?t.days:[];

  t.days.forEach(d=>{['acts','food','planB','lookPhotos','files'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});if(!d.cx||typeof d.cx!=='object')d.cx={}});
  return t;
}

const toMin=s=>{if(!s||!/^\d{1,2}:\d{2}/.test(s))return null;const[h,m]=s.split(':').map(Number);return h*60+m};

function timed(d){return d.acts.map((a,j)=>({a,j})).filter(x=>toMin(x.a.time)!=null).sort((x,y)=>toMin(x.a.time)-toMin(y.a.time))}
function legsOf(t,d){
  const list=timed(d),home=t.hotel.address||t.hotel.name;let prev=home||null;
  return list.map(x=>{const place=x.a.place||x.a.name;const leg={from:prev,to:place,x};prev=place;return leg}).filter(l=>l.from&&l.to);
}
function rTimeline(t,d){
  const list=timed(d);
  if(!list.length)return `<p class="muted" style="margin:0">Coloque horário nos passeios abaixo para montar a agenda do dia.</p>`;
  const home=t.hotel.address||t.hotel.name,city=t.city||'';
  let prevPlace=home||null,prevEnd=null,out='';
  if(home)out+=`<div class="slot start"><div class="slot-t"><small>saída</small></div><div class="slot-c"><b>${esc(t.hotel.name||'Hospedagem')}</b></div></div>`;
  list.forEach(({a},k)=>{
    const place=a.place||a.name,start=toMin(a.time),tr=numIn(a.travel);
    if(prevPlace&&place){
      let tag='';
      if(prevEnd!=null){const gap=start-prevEnd;
        if(gap<0)tag=`<span class="tag bad">horários se sobrepõem</span>`;
        else if(tr&&tr>gap)tag=`<span class="tag bad">faltam ${dur(tr-gap)}</span>`;
        else if(gap-tr>=30)tag=`<span class="tag ok">${dur(gap-tr)} livres</span>`;}
      out+=`<div class="leg"><span class="leg-line"></span><div class="leg-info">${modeIcon(a.mode)} ${tr?`~${dur(tr)}${a.mode?' de '+esc(a.mode.toLowerCase()):''}`:'deslocamento não informado'}
        <a class="maplink" href="${dirUrl(prevPlace,place,a.mode,city)}" target="_blank" rel="noopener">Rota</a> ${tag}</div></div>`;
    }else if(k>0)out+=`<div class="leg"><span class="leg-line" style="min-height:16px"></span><span></span></div>`;
    const c=numIn(a.cost);
    out+=`<div class="slot"><div class="slot-t"><b>${esc(a.time)}</b>${a.end?`<small>até ${esc(a.end)}</small>`:''}</div>
      <div class="slot-c"><b>${esc(a.name||'Sem nome')}</b>${a.place&&a.place!==a.name?`<span>${esc(a.place)}</span>`:''}${c?`<span> · ${brl(c)}</span>`:''}</div></div>`;
    prevPlace=place||prevPlace;prevEnd=toMin(a.end);
  });
  const sem=d.acts.length-list.length;
  if(sem)out+=`<p class="muted" style="font-size:13px;margin:10px 0 0">${sem} item(s) sem horário não aparecem na agenda.</p>`;
  return `<div class="tl">${out}</div>`;
}

function nowCard(t,i){
  const d=t.days[i],list=timed(d),nm=nowM(),home=t.hotel.address||t.hotel.name;
  const head=`<span class="label">Hoje · Dia ${i+1}</span>`;
  if(!list.length)return `<section class="card now">${head}<h2>Nenhum horário marcado hoje</h2><p>Coloque horário nos passeios para ver o próximo compromisso aqui.</p></section>`;
  const k=list.findIndex(x=>toMin(x.a.time)>nm);
  const cur=list.find(x=>toMin(x.a.time)<=nm&&toMin(x.a.end)!=null&&nm<toMin(x.a.end));
  let out='';
  if(cur)out+=`<div><span class="label">Agora</span><h2>${esc(cur.a.name||'Atividade')}</h2><p>até ${esc(cur.a.end)}</p></div>`;
  if(k>=0){const nx=list[k].a,mins=toMin(nx.time)-nm,tr=numIn(nx.travel),from=k>0?(list[k-1].a.place||list[k-1].a.name):home,to=nx.place||nx.name;
    out+=`<div><span class="label">Próximo · em ${dur(mins)}</span><h2>${esc(nx.time)} · ${esc(nx.name||'Atividade')}</h2>
      ${tr?`<p><b>${mins-tr>0?`Sair em ${dur(mins-tr)}`:'Sair agora'}</b> · ~${dur(tr)} de deslocamento</p>`:''}
      ${from&&to?`<p><a class="maplink" href="${dirUrl(from,to,nx.mode,t.city||'')}" target="_blank" rel="noopener">Abrir rota no Maps</a></p>`:''}</div>`}
  if(!out)out=`<h2>Programação de hoje concluída</h2><p>Bom descanso!</p>`;
  return `<section class="card now">${cur||k>=0?head:''}<div class="now-grid">${out}</div></section>`;
}

function budgetData(t){
  const acts=t.days.flatMap((d,i)=>d.acts.map(a=>({name:a.name||'Passeio',cat:'Passeios',cost:numIn(a.cost),paid:a.paid,day:i})));
  const food=t.days.flatMap(d=>d.food.map(f=>({name:f.name||'Refeição',cat:'Alimentação',cost:numIn(f.cost),paid:f.went})));
  const ex=t.expenses.map(e=>({name:e.name,cat:e.cat||'Outros',cost:numIn(e.cost),paid:e.paid}));
  const all=acts.concat(food,ex);
  const total=all.reduce((s,x)=>s+x.cost,0),paid=all.filter(x=>x.paid).reduce((s,x)=>s+x.cost,0);
  const byCat={};all.forEach(x=>{byCat[x.cat]=(byCat[x.cat]||0)+x.cost});
  return{total,paid,byCat};
}

 mala:[], conferir:[['topo','Não esquecer']],
 docs:[['docs','Documentos para levar'],['arquivos','Arquivos da viagem']],
 notas:[['notas','Bloco de notas']]
};
const SEC_TYPES=[['lista','Lista de tarefas','Itens para marcar'],['texto','Texto livre','Como um bloco de notas'],['campos','Campos','Nome e valor, ex.: Senha do Wi-Fi'],['anexos','Fotos e arquivos','Imagens e PDFs']];
const PROTECTED_CATS=['Passeios','Alimentação','Transporte'];
const defTitle=(scope,id)=>{const b=(BUILT[scope]||[]).find(x=>x[0]===id);return b?b[1]:''};
function normLayout(t){
  t.layout=t.layout&&typeof t.layout==='object'?t.layout:{};
  Object.keys(BUILT).forEach(sc=>{
    const L=Array.isArray(t.layout[sc])?t.layout[sc]:[];
    BUILT[sc].forEach(([id],k)=>{if(!L.find(e=>e.id===id))L.splice(Math.min(k,L.length),0,{id,title:'',hidden:false})});
    t.layout[sc]=L.filter(e=>e&&e.id);
  });
  if(!t.cx||typeof t.cx!=='object')t.cx={};
  ['hiddenF','tabsOff','skip'].forEach(k=>{if(!Array.isArray(t[k]))t[k]=[]});
  if(!Array.isArray(t.cats)||!t.cats.length)t.cats=CATS.slice();
  PROTECTED_CATS.forEach(c=>{if(!t.cats.includes(c))t.cats.push(c)});
}
const cxDefault=type=>type==='texto'?'':[];
function cxPath(scope,e){return scope==='day'?`days.${S.view.day}.cx.${e.id}`:`cx.${e.id}`}
function ensureCx(t,path,type){if(getPath(t,path)===undefined)setPath(t,path,cxDefault(type));return getPath(t,path)}
function hidF(t,key){return t.hiddenF.includes(key)}
/* campo que pode ser escondido */
function fldX(t,key,label,path,val,ph,extra){
  if(hidF(t,key))return '';
  return `<label class="field"><span class="fl">${label}<button class="xs" data-act="hideF" data-key="${key}" aria-label="Excluir campo ${esc(label)}">${I.x}</button></span>${inp(path,val,ph,extra)}</label>`;
}
function areaX(t,key,label,path,val,ph){
  if(hidF(t,key))return '';
  return `<label class="field"><span class="fl">${label}<button class="xs" data-act="hideF" data-key="${key}" aria-label="Excluir campo ${esc(label)}">${I.x}</button></span>${area(path,val,ph)}</label>`;
}
/* campos extras (nome + valor) */
function kvList(t,path){
  const arr=ensureCx(t,path,'campos');
  return `${arr.map((x,i)=>`<div class="kv">${inp(`${path}.${i}.k`,x.k,'Nome do campo',`data-k="${path}" aria-label="Nome do campo"`)}${inp(`${path}.${i}.v`,x.v,'Valor','aria-label="Valor"')}<button class="iconbtn" data-act="del" data-path="${path}.${i}" aria-label="Remover campo">${I.x}</button></div>`).join('')}
   <button class="addrow" data-act="add" data-path="${path}" data-tpl="kv">${I.plus} Adicionar campo</button>`;
}
function menuBtn(scope,id){return `<button class="iconbtn more" data-act="secMenu" data-scope="${scope}" data-id="${id}" aria-label="Opções da seção">${I.dots}</button>`}
function sec(scope,e,right,body,o){
  o=o||{};const title=e.title||defTitle(scope,e.id)||'Seção';
  return `<section class="card ${o.cls||''}" data-sec="${e.id}"><div class="card-h"><h2>${o.icon||''}${esc(title)}</h2><span class="sec-r">${right||''}${menuBtn(scope,e.id)}</span></div>${body}</section>`;
}
function rCustom(t,scope,e){
  const path=cxPath(scope,e),val=ensureCx(t,path,e.type);
  const body=e.type==='texto'?area(path,val,'Escreva aqui…','notepad')
    :e.type==='campos'?kvList(t,path)
    :e.type==='anexos'?filesGrid(path,val,'Anexar')
    :checklist(path,val,'Item','todo');
  const right=e.type==='lista'&&val.length?`<span class="muted num">${progress(val).txt}</span>`:'';
  return sec(scope,e,right,body);
}
function layoutRender(t,scope,map,d){
  return t.layout[scope].filter(e=>!e.hidden&&(!e.only||(d&&e.only===d.date))).map(e=>{
    if(e.type)return rCustom(t,scope,e);
    const f=map[e.id];return f?f(e):'';
  }).join('')+`<button class="addrow addsec" data-act="addSec" data-scope="${scope}">${I.plus} Adicionar seção</button>`;
}

/* ================= Info ================= */

        <button class="btn small onacc" data-act="openDay" data-i="${ti}">Abrir o dia de hoje</button></section>`;
      if(daysTo(t.start)>0&&t.days.length)return sec(S_,e,`<button class="btn small ghost" data-act="sim">Ver como fica</button>`,
        `<p class="muted" style="margin:0">A partir de ${esc(fmt(t.start))}, o app abre direto no dia de hoje, mostrando o próximo compromisso e a hora de sair.</p>`);
      return '';},
    todo(e){const pr=progress(t.todos);return sec(S_,e,`<span class="muted num">${pr.txt}</span>`,`<div class="bar" style="margin-bottom:10px"><i style="width:${pr.p}%"></i></div>${checklist('todos',t.todos,'Ex.: comprar ingresso do Unipraias','todo')}`)},
    hotel(e){return sec(S_,e,t.hotel.address||t.hotel.name?`<a class="maplink" href="${maps(t.hotel.address||t.hotel.name+' '+t.city)}" target="_blank" rel="noopener">${I.pin} Mapa</a>`:'',
      `<div class="stack" style="gap:10px">${fldX(t,'hotel:name','Hotel / casa','hotel.name',t.hotel.name,'Nome da hospedagem')}${fldX(t,'hotel:address','Endereço','hotel.address',t.hotel.address,'Rua, número, bairro')}
       <div class="grid2">${fldX(t,'hotel:checkin','Check-in','hotel.checkin',t.hotel.checkin,'Ex.: 05/12 às 14h')}${fldX(t,'hotel:checkout','Check-out','hotel.checkout',t.hotel.checkout,'Ex.: 10/12 às 11h')}
       ${fldX(t,'hotel:code','Código da reserva','hotel.code',t.hotel.code,'')}${fldX(t,'hotel:phone','Telefone','hotel.phone',t.hotel.phone,'','inputmode="tel"')}</div>
       ${areaX(t,'hotel:notes','Observações','hotel.notes',t.hotel.notes,'Café da manhã incluso? Estacionamento? Wi-Fi?')}
       <div>${kvList(t,'cx.hotel_f')}</div></div>`,{icon:I.bed.replace('<svg','<svg width="20" height="20" style="vertical-align:-3px;color:var(--accent);margin-right:6px"')})},
    transp(e){const tx=t.expenses.map((x,i)=>({e:x,i})).filter(x=>x.e.cat==='Transporte'),tot=tx.reduce((s,x)=>s+numIn(x.e.cost),0);
      return sec(S_,e,'',`<div class="stack" style="gap:10px">${fldX(t,'transp:origin','Origem (de onde vamos sair)','origin',t.origin,'Cidade ou endereço de casa')}
       ${t.origin&&!hidF(t,'transp:origin')?`<a class="maplink" href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(t.origin)}&destination=${encodeURIComponent((t.hotel.address||t.hotel.name||'')+' '+(t.city||t.name))}" target="_blank" rel="noopener">${I.pin} Rota de ${esc(t.origin)} até a hospedagem</a>`:''}
       ${fldX(t,'transp:kind','Transporte','transport.kind',t.transport.kind,'Carro, avião, ônibus…')}
       <div class="grid2">${fldX(t,'transp:go','Ida','transport.go',t.transport.go,'Data, horário, voo')}${fldX(t,'transp:back','Volta','transport.back',t.transport.back,'Data, horário, voo')}</div>
       ${fldX(t,'transp:code','Localizador / reserva','transport.code',t.transport.code,'')}
       <div>${kvList(t,'cx.transp_f')}</div></div>
       ${hidF(t,'transp:gastos')?'':`<div class="card-h" style="margin:16px 0 0"><span class="label">Gastos com transporte</span><span class="sec-r"><b class="num" data-calc="txtot" style="color:var(--accent)">${brl(tot)}</b><button class="xs" data-act="hideF" data-key="transp:gastos" aria-label="Excluir gastos com transporte">${I.x}</button></span></div>
       ${tx.map(({e:x,i})=>`<div class="exp">${inp(`expenses.${i}.name`,x.name,'Ex.: pedágio da BR-101',`data-k="expenses"`)}${inp(`expenses.${i}.cost`,x.cost||'','0,00','inputmode="decimal" data-type="num"')}
         <div class="sub"><label class="paid"><input type="checkbox" data-bind="expenses.${i}.paid" ${x.paid?'checked':''}> Pago</label><button class="iconbtn" data-act="del" data-path="expenses.${i}" aria-label="Remover">${I.trash}</button></div>${payersUI(`expenses.${i}`,x)}</div>`).join('')}
       <button class="addrow" data-act="add" data-path="expenses" data-tpl="texp">${I.plus} Adicionar gasto de transporte</button>
       <p class="muted" style="font-size:13px;margin:8px 0 0">Tudo o que entrar aqui soma no Orçamento.</p>`}`,{icon:I.car.replace('<svg','<svg width="20" height="20" style="vertical-align:-3px;color:var(--accent);margin-right:6px"')})},
    clima(e){const wx=t.weather,by={};(wx&&Array.isArray(wx.dias)?wx.dias:[]).forEach(x=>{if(x&&x.data)by[x.data]=x});
      const n=t.days.filter(d=>by[d.date]).length,at=wx&&wx.at?new Date(wx.at):null;
      const cells=t.days.map(d=>{const x=by[d.date];return x?`<div class="wx-d"><small>${esc(fmt(d.date,{weekday:'short',day:'numeric'}))}</small>${I[{sol:'sun',parcial:'partly',nublado:'cloud',chuva:'rain'}[x.cond]||'partly']}<span class="t num">${Math.round(x.max)}°</span><small class="num">mín ${Math.round(x.min)}°${x.chuva!=null?` · ${Math.round(x.chuva)}% chuva`:''}</small>${x.texto?`<small>${esc(x.texto)}</small>`:''}</div>`
        :`<div class="wx-d wx-empty"><small>${esc(fmt(d.date,{weekday:'short',day:'numeric'}))}</small><span class="dash">—</span><small>sem previsão</small></div>`}).join('');
      return sec(S_,e,'',`<div class="wx">${cells}</div>
        <p class="muted" style="font-size:13px;margin:10px 0 0">${n?`Previsão da ${esc(wx.fonte||'Climatempo')}${at?`, atualizada em ${esc(at.toLocaleDateString('pt-BR',{day:'numeric',month:'short'}))} às ${esc(at.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}))}`:''}. `:'Ainda não existe previsão para esses dias. '}${window.claude&&window.claude.local?'Atualiza sempre que você abre o app':'Atualiza sozinha todo dia de manhã'}, conforme a previsão muda; cada dia aparece quando entrar na previsão (uns 5 a 15 dias antes).</p>
        <p style="margin:8px 0 0"><a class="maplink" href="https://www.google.com/search?q=${encodeURIComponent('previsão do tempo '+(t.city||t.name))}" target="_blank" rel="noopener">Ver previsão no Google</a></p>`)},
    lembr(e){return sec(S_,e,'',checklist('reminders',t.reminders,'Ex.: levar adaptador, ligar o alarme da casa','reminder'))},
    lugares(e){return sec(S_,e,!HAS_AI?'':`<button class="btn small ghost" data-act="ideas" ${S.busy.ideas?'disabled':''}>${S.busy.ideas?'<span class="spin"></span> Pensando':I.spark+' Sugerir'}</button>`,
      `${t.ideas.map((x,i)=>`<div class="idea"><div class="idea-pin">${I.pin}</div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">

        ${inp(`ideas.${i}.desc`,x.desc,'Descrição ou preço','aria-label="Descrição"')}
        <div><select data-idea="${i}" aria-label="Levar para um dia"><option value="">+ Colocar no roteiro…</option>${t.days.map((d,j)=>`<option value="${j}">Dia ${j+1} · ${esc(fmtLong(d.date))}</option>`).join('')}</select>
        ${x.name?`<a class="maplink" style="margin-left:8px" href="${maps(x.name+' '+(t.city||''))}" target="_blank" rel="noopener">${I.pin} Mapa</a>`:''}</div></div>
        <button class="iconbtn" data-act="del" data-path="ideas.${i}" aria-label="Remover">${I.x}</button></div>`).join('')}
       <button class="addrow" data-act="add" data-path="ideas" data-tpl="idea">${I.plus} Adicionar lugar</button>`)},
    regras(e){return sec(S_,e,'',area('rules',t.rules,'Regras do hotel, horários, combinados do grupo…'))},
    contatos(e){return sec(S_,e,'',`<div class="stack" style="gap:8px">${t.contacts.map((c,i)=>`<div class="kv">${inp(`contacts.${i}.name`,c.name,'Nome',`data-k="contacts"`)}${inp(`contacts.${i}.phone`,c.phone,'Telefone','inputmode="tel"')}<button class="iconbtn" data-act="del" data-path="contacts.${i}" aria-label="Remover">${I.x}</button></div>`).join('')}</div>
      <button class="addrow" data-act="add" data-path="contacts" data-tpl="contact">${I.plus} Adicionar contato</button>
      ${hidF(t,'contatos:emerg')?'':`<p class="muted fl" style="font-size:13px;margin:8px 0 0">Emergências: SAMU 192 · Bombeiros 193 · Polícia 190<button class="xs" data-act="hideF" data-key="contatos:emerg" aria-label="Excluir linha de emergências">${I.x}</button></p>`}`)}

/* ================= Dia ================= */
function rDay(){

  const P=`days.${i}`,SC='day';
  const map={
    agora(e){if(d.date!==today())return '';
      return `${S.simDate?`<p class="note" style="margin:0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap">Simulando o modo viagem neste dia. <button class="btn small line" data-act="endSim">Sair da simulação</button></p>`:''}<div data-calc="now" data-sec="agora">${nowCard(t,i)}</div>`},
    base(e){return sec(SC,e,'',`<div class="stack" style="gap:10px">${fldX(t,'base:title','Título do dia',`${P}.title`,d.title,'Ex.: Praia Central e Roda-Gigante')}
      ${fldX(t,'base:place','Onde vamos',`${P}.place`,d.place,'Bairro, praia ou cidade')}
      ${d.place&&!hidF(t,'base:place')?`<a class="maplink" href="${maps(d.place+' '+(t.city||''))}" target="_blank" rel="noopener">${I.pin} Abrir no mapa</a>`:''}
      <div>${kvList(t,`${P}.cx.base_f`)}</div></div>`)},
    agenda(e){return sec(SC,e,!HAS_AI?'':`<button class="btn small ghost" data-act="travel" ${S.busy.tr?'disabled':''}>${S.busy.tr?'<span class="spin"></span> Calculando':I.spark+' Deslocamentos'}</button>`,`<div data-calc="timeline">${rTimeline(t,d)}</div>`)},
    prog(e){return sec(SC,e,`<span class="price num" data-calc="daycost" style="font-weight:700;color:var(--accent)">${brl(dayCost(d))}</span>`,
     `<div class="stack" style="gap:10px">${d.acts.map((a,j)=>`<div class="act">

      <label class="field full"><span>Passeio / atividade</span>${inp(`${P}.acts.${j}.name`,a.name,'Ex.: Parque Unipraias',`data-k="acts"`)}</label>
      <label class="field full"><span>Local</span>${inp(`${P}.acts.${j}.place`,a.place,'Endereço ou nome do lugar')}</label>
      <label class="field"><span>Valor (R$)</span>${inp(`${P}.acts.${j}.cost`,a.cost||'','0,00','inputmode="decimal" data-type="num"')}</label>
      <label class="field"><span>Anotação</span>${inp(`${P}.acts.${j}.notes`,a.notes,'Levar o quê, reservar…')}</label>

       <span style="display:flex;gap:6px;align-items:center">${f.name?`<a class="maplink" href="${maps(f.name+' '+(t.city||''))}" target="_blank" rel="noopener">${I.pin} Mapa</a>`:''}<button class="iconbtn" data-act="del" data-path="${P}.food.${j}" aria-label="Remover restaurante">${I.trash}</button></span></div>
      ${f.went?`<label class="field full"><span>O que achamos</span>${inp(`${P}.food.${j}.review`,f.review,'Voltaria? O que foi bom ou ruim?')}</label>`:''}

/* ================= Orçamento ================= */
function allCats(t,b){return t.cats.concat(Object.keys(b?b.byCat:{}).filter(c=>!t.cats.includes(c)))}
function rBudgetSummary(t){

    <div class="checks">${arr.map((x,i)=>x.cat!==c?'':`<div class="check ${x.done?'done':''}"><input type="checkbox" data-bind="${path}.${i}.done" ${x.done?'checked':''} aria-label="Feito">${inp(`${path}.${i}.t`,x.t,'Item',`data-k="${path}-${esc(c)}"`)}<button class="iconbtn" data-act="del" data-path="${path}.${i}" aria-label="Remover">${I.x}</button></div>`).join('')}</div>
    <button class="addrow" data-act="add" data-path="${path}" data-tpl="mala" data-cat="${esc(c)}">${I.plus} Adicionar em ${esc(c)}</button></section>`}).join('')
   +`<button class="addrow" data-act="addGrp" data-path="${path}">${I.plus} Criar grupo</button>`;
}
function rConferir(t){
  const map={topo(e){const pr=progress(t.saida);return sec('conferir',e,`<span class="muted num">${pr.txt}</span>`,`<div class="bar"><i style="width:${pr.p}%"></i></div>
   <p class="muted" style="font-size:13.5px;margin:10px 0 0">Passe a lista na porta, na hora de sair. Use "Desmarcar" para conferir de novo na volta.</p>`)+groups('saida',t.saida,true)}};

function bagProg(b){const it=b.blocks.flatMap(k=>k.items);return progress(it)}

/* ================= pagantes ================= */
function payersUI(path,item){
  const t=trip(),ps=Array.isArray(item.payers)?item.payers:[];
  return `<div class="payers full" data-ppath="${path}"><div class="payers-h"><span class="label">Quem paga</span><span class="muted num" data-calc="ph">${phText(item)}</span></div>
   ${ps.map((p,k)=>`<div class="payer"><select data-bind="${path}.payers.${k}.name" aria-label="Quem paga">${!p.name?'<option value="" selected>Escolha…</option>':''}${p.name&&!t.payers.includes(p.name)?`<option selected>${esc(p.name)}</option>`:''}${t.payers.map(n=>`<option ${n===p.name?'selected':''}>${esc(n)}</option>`).join('')}</select>${inp(`${path}.payers.${k}.value`,p.value||'','0,00','inputmode="decimal" data-type="num" aria-label="Valor"')}<button class="iconbtn" data-act="del" data-path="${path}.payers.${k}" aria-label="Remover pagante">${I.x}</button></div>`).join('')}
   <div class="payer-actions">${t.payers.length?`<button class="linkbtn" data-act="addPayer" data-path="${path}">${I.plus} Pagante</button>${ps.length>1?`<button class="linkbtn" data-act="splitEq" data-path="${path}">Dividir igual</button>`:''}`
     :`<span class="muted" style="font-size:13px">Cadastre os pagantes em</span><button class="linkbtn" data-act="goPayers">Orçamento › Quem paga</button>`}</div></div>`;
}
function allPayerLists(t){const L=[];t.days.forEach(d=>[...d.acts,...d.food].forEach(x=>{if(Array.isArray(x.payers))L.push(x)}));t.expenses.forEach(x=>{if(Array.isArray(x.payers))L.push(x)});return L}
function phText(item){const ps=Array.isArray(item.payers)?item.payers:[];if(!ps.length)return '';const tot=numIn(item.cost),sum=ps.reduce((s,p)=>s+numIn(p.value),0),diff=tot-sum;
  return `${brl(sum)} de ${brl(tot)}${diff>0.009?` · falta ${brl(diff)}`:diff<-0.009?` · passou ${brl(-diff)}`:''}`}
function costItems(t){
  const out=[];
  t.days.forEach((d,i)=>{d.acts.forEach(a=>out.push({name:a.name||'Passeio',where:`Dia ${i+1}`,x:a}));d.food.forEach(f=>out.push({name:f.name||'Refeição',where:`Dia ${i+1}`,x:f}))});
  t.expenses.forEach(e=>out.push({name:e.name||e.cat||'Gasto',where:e.cat,x:e}));
  return out.filter(o=>numIn(o.x.cost)>0||(o.x.payers||[]).length);
}
function payerTotals(t){
  const by={};let open=0;
  costItems(t).forEach(o=>{const ps=o.x.payers||[];let sum=0;
    ps.forEach(p=>{const n=(p.name||'').trim()||'Sem nome',v=numIn(p.value);sum+=v;(by[n]=by[n]||{total:0,items:[]}).total+=v;by[n].items.push({name:o.name,where:o.where,v})});
    open+=Math.max(0,numIn(o.x.cost)-sum)});
  return{by,open};
}
function peopleNames(t){const set=new Set();(t.people||'').split(/,| e /).map(s=>s.trim()).filter(Boolean).forEach(n=>set.add(n));costItems(t).forEach(o=>(o.x.payers||[]).forEach(p=>{if(p.name&&p.name.trim())set.add(p.name.trim())}));return[...set]}
function rPayers(t){
  const {by,open}=payerTotals(t),names=Object.keys(by).sort((a,b)=>by[b].total-by[a].total);
  if(!names.length&&!open)return '<p class="muted" style="margin:0">Em cada gasto, toque em "+ Pagante" para anotar quem paga e quanto.</p>';
  return names.map(n=>`<details class="pay-row"><summary><span>${esc(n)}</span><b class="num">${brl(by[n].total)}</b></summary>${by[n].items.map(x=>`<div class="row-money" style="font-size:13.5px"><span class="muted">${esc(x.name)} · ${esc(x.where)}</span><span class="num">${brl(x.v)}</span></div>`).join('')}</details>`).join('')
   +(open>0.009?`<div class="row-money"><span class="muted">Sem pagante definido</span><b class="num" style="color:var(--bad)">${brl(open)}</b></div>`:'');
}

const EXP_DEFAULT_OFF=['opt:daynotes'];
const curExp=()=>{const t=trip();return t&&t.exports.find(x=>x.id===S.view.exp)};
function docModel(t){
  const G=[],kvs=a=>(Array.isArray(a)?a:[]).filter(x=>x&&(x.k||x.v));
  const g=(key,title,children,extra)=>{children=children.filter(Boolean);G.push({key,title,children,extra:extra||[],empty:!children.length})};

  g('hotel','Hospedagem',[['name','Hospedagem'],['address','Endereço'],['checkin','Check-in'],['checkout','Check-out'],['code','Código da reserva'],['phone','Telefone'],['notes','Observações']]
    .filter(([f])=>t.hotel[f]&&!hidF(t,'hotel:'+f)).map(([f,l])=>({key:'hotel:'+f,label:l,lines:[{k:l,v:t.hotel[f]}]}))

function compress(file){
  return new Promise(res=>{
    if(!/^image\/(jpeg|png|webp|heic|heif)/.test(file.type)){res(file);return}
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const m=1600,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);res(b?new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file)},'image/jpeg',.82)};
    img.onerror=()=>{URL.revokeObjectURL(u);res(file)};img.src=u;
  });
}

/* ================= backup ================= */
const BK_APP='nossas-viagens';
function bkPayload(){const trips={};Object.values(S.trips).forEach(t=>trips[t.id]=clean(t));return{app:BK_APP,version:1,at:new Date().toISOString(),trips}}
function restoreTrips(trips){let n=0;Object.keys(trips||{}).forEach(id=>{const t=trips[id];if(!t||typeof t!=='object')return;S.trips[id]=normalize(Object.assign({},t,{id}));save(id);n++});return n}
async function snapshot(manual){
  if(S.mode!=='db')return false;const day=iso(new Date());
  try{await S.db.collection('backups').doc(day).set({at:new Date().toISOString(),count:Object.keys(S.trips).length,data:JSON.stringify(bkPayload())});S.lastSnap=day;
    if(manual){const all=await S.db.collection('backups').orderBy('at','desc').get();all.docs.slice(15).forEach(d=>S.db.collection('backups').doc(d.id).delete().catch(()=>{}))}
    return true}catch(e){return false}
}
function autoSnap(){if(S.mode==='db'&&S.lastSnap!==iso(new Date())&&Object.keys(S.trips).length){S.lastSnap=iso(new Date());setTimeout(()=>snapshot(false),3000)}}
async function bkList(){
  const box=$('#bk-list');if(!box)return;
  if(S.mode!=='db'){box.innerHTML='<p class="muted" style="margin:0">Cópias automáticas só funcionam com a conta conectada. Use o arquivo de backup.</p>';return}
  try{const snap=await S.db.collection('backups').orderBy('at','desc').limit(15).get();
    box.innerHTML=snap.empty?'<p class="muted" style="margin:0">Nenhuma cópia ainda. O app salva uma por dia, sozinho, quando você mexe em algo.</p>':
      snap.docs.map(d=>{const x=d.data(),dt=new Date(x.at);return `<div class="bk-row"><span><b>${esc(dt.toLocaleDateString('pt-BR',{day:'numeric',month:'short',year:'numeric'}))}</b> <span class="muted">às ${esc(dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}))} · ${x.count||0} viagem(ns)</span></span><button class="btn small line" style="width:auto" data-act="bkRestore" data-id="${esc(d.id)}">Restaurar</button></div>`}).join('')}
  catch(e){box.innerHTML='<p class="muted" style="margin:0">Não consegui carregar as cópias agora.</p>'}
}
$('#bkpick').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{importText(await f.text())}catch(err){toast('Não consegui ler esse arquivo.')}});
function importText(txt){
  let o;try{o=JSON.parse(txt)}catch(e){toast('Esse texto não é um backup válido.');return}
  if(!o||o.app!==BK_APP||!o.trips){toast('Esse arquivo não é um backup do Nossas Viagens.');return}
  const n=Object.keys(o.trips).length,dt=o.at?new Date(o.at).toLocaleDateString('pt-BR'):'';
  confirmSheet(`Restaurar ${n} viagem(ns) do backup${dt?' de '+dt:''}? Viagens iguais serão substituídas pela versão do backup.`,'Restaurar',async()=>{if(o.files&&window.__localAssets)await window.__localAssets.importAll(o.files);const k=restoreTrips(o.trips);closeSheet();S.view={screen:'home'};render();toast(`${k} viagem(ns) restaurada(s)`)});
}

  async bkRestore(el){try{const d=await S.db.collection('backups').doc(el.dataset.id).get();if(!d.exists){toast('Essa cópia não existe mais.');return}importText(d.data().data)}catch(e){toast('Não consegui abrir essa cópia.')}},
  weather(){askWeather()}, ideas(){askIdeas()}, travel(){askTravel()},
  closeSheet(){closeSheet()}, closeSheetBg(el,e){if(e.target===el)closeSheet()},
  yes(){const f=S.onYes;S.onYes=null;if(f)f()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(fn){if(el.dataset.act!=='closeSheetBg')e.preventDefault();fn(el,e)}});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.bind||el.type==='checkbox'||el.tagName==='SELECT')return;const t=trip();if(!t)return;
  setPath(t,el.dataset.bind,el.dataset.type==='num'?numIn(el.value):el.value);save();
  const b=document.querySelector('[data-calc="budget"]');if(b&&el.dataset.type==='num')b.innerHTML=rBudgetSummary(t);
  const dc=document.querySelector('[data-calc="daycost"]');if(dc&&S.view.screen==='day')dc.textContent=brl(dayCost(t.days[S.view.day]));if(S.view.screen==='day')refreshTimeline();if(S.view.screen==='export')refreshPreview();
  const pp=el.closest&&el.closest('[data-ppath]');if(pp){const ph=pp.querySelector('[data-calc="ph"]');if(ph)ph.textContent=phText(getPath(t,pp.dataset.ppath))}
  const py=document.querySelector('[data-calc="payers"]');if(py&&(pp||el.dataset.type==='num'))py.innerHTML=rPayers(t);const tt=document.querySelector('[data-calc="txtot"]');if(tt)tt.textContent=brl(t.expenses.filter(e=>e.cat==='Transporte').reduce((s,e)=>s+numIn(e.cost),0))});
document.addEventListener('change',e=>{const el=e.target;const t=trip();if(!t)return;
  if(el.classList.contains('xk')){const cfg=curExp();if(!cfg)return;const k=el.dataset.key;cfg.off=cfg.off.filter(x=>x!==k);if(!el.checked)cfg.off.push(k);save();render();return}
  if(el.classList.contains('grp-name')){const o=el.dataset.old,v=el.value.trim();if(v&&v!==o){t[el.dataset.path].forEach(x=>{if(x.cat===o)x.cat=v});save()}render();return}
  if(el.classList.contains('payer-name')){const o=el.dataset.old,v=el.value.trim();if(v&&v!==o&&!t.payers.includes(v)){t.payers[t.payers.indexOf(o)]=v;allPayerLists(t).forEach(x=>x.payers.forEach(p=>{if(p.name===o)p.name=v}));save()}else if(v!==o&&t.payers.includes(v))toast('Já existe um pagante com esse nome.');render();return}
  if(el.classList.contains('cat-name')){const o=el.dataset.old,v=el.value.trim();if(v&&v!==o&&!t.cats.includes(v)){t.cats[t.cats.indexOf(o)]=v;t.expenses.forEach(x=>{if(x.cat===o)x.cat=v});save()}else if(t.cats.includes(v)&&v!==o)toast('Já existe uma categoria com esse nome.');render();return}
  if(el.dataset.idea!=null&&el.value!==''){const x=t.ideas[+el.dataset.idea],d=t.days[+el.value];d.acts.push({time:'',end:'',name:x.name,place:x.name,cost:0,paid:false,notes:x.desc||'',travel:0,mode:''});save();toast(`Colocado no Dia ${+el.value+1}`);render();return}
  if(!el.dataset.bind)return;
  if(el.type==='checkbox'){setPath(t,el.dataset.bind,el.checked);save();render()}
  else if(el.tagName==='SELECT'){setPath(t,el.dataset.bind,el.value);save();{const py=document.querySelector('[data-calc="payers"]');if(py)py.innerHTML=rPayers(t)}refreshTimeline();const b=document.querySelector('[data-calc="budget"]');if(b)b.innerHTML=rBudgetSummary(t)}});
document.addEventListener('toggle',e=>{const el=e.target;if(el.matches&&el.matches('details.xdet')){S.xOpen=S.xOpen||new Set();el.open?S.xOpen.add(el.dataset.g):S.xOpen.delete(el.dataset.g);return}if(el.matches&&el.matches('details.planb')){const i=+el.dataset.day;el.open?S.openB.add(i):S.openB.delete(i)}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').innerHTML)closeSheet();
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.k&&e.target.closest('.check')){e.preventDefault();const add=e.target.closest('.card').querySelector('.addrow');if(add)add.click()}});
window.addEventListener('pagehide',()=>{Object.keys(S.timers).forEach(id=>{if(S.dirty.has(id)){clearTimeout(S.timers[id]);flush(id)}})});

/* ================= início ================= */
render();
(async()=>{
  const c=window.claude;
  const [db,assets]=c?await Promise.all([c.use('db').catch(()=>null),c.use('assets').catch(()=>null)]):[null,null];
  S.assets=assets;
  if(db){
    S.db=db;
    const load=d=>{try{return normalize(Object.assign(JSON.parse(JSON.stringify(d.data()||{})),{id:d.id}))}catch(e){console.error('viagem com erro',d.id,e);return null}};
    const apply=snap=>{
      const seen=new Set();
      snap.docs.forEach(d=>{seen.add(d.id);if(S.dirty.has(d.id)||S.saving.has(d.id))return;const t=load(d);if(t)S.trips[d.id]=t});
      Object.keys(S.trips).forEach(id=>{if(!seen.has(id)&&!S.dirty.has(id)&&!S.saving.has(id))delete S.trips[id]});
      S.mode='db';autoOpen();softRender();if(!S.wxDone){S.wxDone=true;setTimeout(liveWeather,500)}
    };
    setTimeout(()=>{if(S.mode==='loading')db.collection('trips').get().then(apply).catch(e=>{S.dbErr=e&&e.code||'sem resposta';fallback()})},6000);
    db.collection('trips').onSnapshot(snap=>{try{apply(snap)}catch(e){console.error(e);S.mode='db';softRender()}},err=>{S.dbErr=err&&err.code||'desconhecido';
      db.collection('trips').get().then(apply)
        .catch(()=>{if(S.mode==='loading')fallback();toast('Não consegui ler as viagens salvas ('+S.dbErr+').')})});
  }else fallback();
})();
const WMO=c=>c<=1?['sol',c?'Poucas nuvens':'Céu limpo']:c===2?['parcial','Sol entre nuvens']:c===3?['nublado','Nublado']:c<=48?['nublado','Neblina']:c<=57?['chuva','Garoa']:c<=67?['chuva','Chuva']:c<=77?['nublado','Neve']:c<=82?['chuva','Pancadas de chuva']:['chuva','Trovoadas'];
async function liveWeather(){
  if(!(window.claude&&window.claude.local)||!navigator.onLine)return;
  for(const t of Object.values(S.trips)){
    try{if(!t.start||!t.days.length)continue;const a=daysTo(t.start),b=daysTo(t.end);if(b<0||a>16)continue;
      const w=t.weather;if(w&&w.fonte==='Open-Meteo'&&w.at&&Date.now()-new Date(w.at)<3*3600e3)continue;
      const q=(t.city||t.name).split(',')[0].trim();
      if(!t.geo||t.geo.q!==q){const g=await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=5&language=pt&format=json&name='+encodeURIComponent(q))).json();
        const r=(g.results||[]).find(x=>x.country_code==='BR')||(g.results||[])[0];if(!r)continue;t.geo={q,lat:r.latitude,lon:r.longitude}}
      const f=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${t.geo.lat}&longitude=${t.geo.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16`)).json();
      const D=f.daily||{},dates=new Set(t.days.map(d=>d.date)),dias=[];
      (D.time||[]).forEach((dt,i)=>{if(!dates.has(dt))return;const [cond,texto]=WMO(D.weather_code[i]);dias.push({data:dt,cond,texto,min:D.temperature_2m_min[i],max:D.temperature_2m_max[i],chuva:D.precipitation_probability_max?D.precipitation_probability_max[i]:null})});
      t.weather={fonte:'Open-Meteo',at:new Date().toISOString(),dias};save(t.id);softRender();
    }catch(e){console.warn('previsão',e)}
  }
}
function fallback(){S.mode='local';const d=lsLoad();Object.keys(d).forEach(id=>S.trips[id]=normalize(Object.assign(d[id],{id})));autoOpen();render()}
function autoOpen(){if(S.autoDone)return;S.autoDone=true;if(S.view.screen!=='home')return;
  for(const t of Object.values(S.trips)){const i=tripToday(t);if(i>=0){S.view={screen:'day',tripId:t.id,day:i,tab:'roteiro'};return}}}
})();
</script>
